<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- 背景渐变：翡翠绿与深蓝数据风 -->
<linearGradient id="bgTeal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#021A1A"/>
<stop offset="50%" stop-color="#042C2F"/>
<stop offset="100%" stop-color="#011216"/>
</linearGradient>

<!-- 面板渐变 -->
<linearGradient id="panelTeal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#093C3C" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#052226" stop-opacity="0.85"/>
</linearGradient>

<!-- 边框发光渐变 -->
<linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#00F0FF"/>
<stop offset="100%" stop-color="#00FFA3"/>
</linearGradient>

<!-- 顶部标题渐变 -->
<linearGradient id="headerTeal" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00FFA3"/>
<stop offset="100%" stop-color="#00F0FF"/>
</linearGradient>

<!-- 强调色滤镜 -->
<filter id="glowTeal" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="5" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<!-- 网格背景 -->
<pattern id="gridTeal" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.1"/>
</pattern>
</defs>

<style>
.pulse-text { animation: pulseText 2s ease-in-out infinite; }
.scan-line { animation: scanLine 4s linear infinite; }
.rotate-slow { animation: spin 20s linear infinite; }
.rotate-fast { animation: spinReverse 12s linear infinite; }
.blink { animation: blink 1.5s infinite; }
@keyframes pulseText { 0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(0,255,163,0.6); } 50% { opacity: 0.7; text-shadow: none; } }
@keyframes scanLine { 0% { transform: translateY(0); } 100% { transform: translateY(180px); } }
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes spinReverse { 100% { transform: rotate(-360deg); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
</style>

<!-- ================= 背景层 ================= -->
<rect width="1920" height="1080" fill="url(#bgTeal)"/>
<rect width="1920" height="1080" fill="url(#gridTeal)"/>

<!-- ================= 顶部 Header ================= -->
<g transform="translate(0 0)">
<path d="M500 0 L600 70 L1320 70 L1420 0 Z" fill="#042C2F" stroke="url(#headerTeal)" stroke-width="2"/>
<text x="960" y="48" text-anchor="middle" font-size="40" fill="#00FFA3" font-family="Microsoft YaHei, Arial" font-weight="bold" filter="url(#glowTeal)">清远仓库数字孪生平台</text>
<text x="1880" y="45" text-anchor="end" font-size="20" fill="#B2F0E8" font-family="Arial">2026-03-20 14:40:29 星期五</text>
<path d="M20 50 L480 50 L520 10" fill="none" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.8"/>
<path d="M1900 50 L1440 50 L1400 10" fill="none" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.8"/>
</g>

<!-- ================= 左侧面板模块 ================= -->
<!-- 1. 环境监测 -->
<g transform="translate(20 90)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M0 10 Q0 0 10 0 L140 0 L160 30 L440 30 L440 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="20" y="22" font-size="18" fill="#00FFA3" font-weight="bold">● 环境监测</text>

<g transform="translate(20 60)">
<rect width="180" height="60" rx="6" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="60" y="25" font-size="16" fill="#B2F0E8">温度</text>
<text x="60" y="50" font-size="24" fill="#00FFA3" font-weight="bold" class="pulse-text">23.1<tspan font-size="14">°C</tspan></text>
</g>
<g transform="translate(220 60)">
<rect width="180" height="60" rx="6" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="60" y="25" font-size="16" fill="#B2F0E8">PM10</text>
<text x="60" y="50" font-size="24" fill="#00F0FF" font-weight="bold">77.0<tspan font-size="14">PU/m³</tspan></text>
</g>
<g transform="translate(20 140)">
<rect width="180" height="60" rx="6" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="60" y="25" font-size="16" fill="#B2F0E8">湿度</text>
<text x="60" y="50" font-size="24" fill="#00FFA3" font-weight="bold">45.9<tspan font-size="14">%</tspan></text>
</g>
<g transform="translate(220 140)">
<rect width="180" height="60" rx="6" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="60" y="25" font-size="16" fill="#B2F0E8">PM2.5</text>
<text x="60" y="50" font-size="24" fill="#00F0FF" font-weight="bold">70.0<tspan font-size="14">PU/m³</tspan></text>
</g>
</g>

<!-- 2. 能源监测 -->
<g transform="translate(20 330)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M0 10 Q0 0 10 0 L140 0 L160 30 L440 30 L440 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="20" y="22" font-size="18" fill="#00FFA3" font-weight="bold">● 能源监测</text>

<!-- 简易折线图 -->
<g transform="translate(40 60)">
<line x1="0" y1="130" x2="360" y2="130" stroke="#00F0FF" stroke-opacity="0.3"/>
<line x1="0" y1="100" x2="360" y2="100" stroke="#00F0FF" stroke-opacity="0.1"/>
<line x1="0" y1="70" x2="360" y2="70" stroke="#00F0FF" stroke-opacity="0.1"/>
<line x1="0" y1="40" x2="360" y2="40" stroke="#00F0FF" stroke-opacity="0.1"/>
<!-- 水耗 -->
<path d="M20 130 L60 30 L100 130 L140 120 L180 130 L220 125 L260 130" fill="none" stroke="#00F0FF" stroke-width="2"/>
<!-- 电耗 -->
<path d="M20 130 L60 10 L100 130 L140 125 L180 130 L220 120 L260 130" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="140" y="10" font-size="12" fill="#00F0FF">━ 水耗</text>
<text x="200" y="10" font-size="12" fill="#00FFA3">━ 电耗</text>
</g>
</g>

<!-- 3. 安防监测 -->
<g transform="translate(20 570)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M0 10 Q0 0 10 0 L140 0 L160 30 L440 30 L440 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="20" y="22" font-size="18" fill="#00FFA3" font-weight="bold">● 安防监测</text>

<g transform="translate(100 130)">
<circle cx="0" cy="0" r="50" fill="none" stroke="#02181A" stroke-width="12"/>
<circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="12" stroke-dasharray="280 314"/>
<text x="0" y="10" text-anchor="middle" font-size="36" fill="#FFF" font-weight="bold" class="pulse-text">174</text>
</g>

<g transform="translate(260 100)">
<text x="0" y="0" font-size="32" fill="#00FFA3" font-weight="bold">163</text>
<text x="0" y="30" font-size="14" fill="#B2F0E8">在线设备</text>
</g>
<g transform="translate(360 100)">
<text x="0" y="0" font-size="32" fill="#FF4B4B" font-weight="bold">11</text>
<text x="0" y="30" font-size="14" fill="#B2F0E8">离线设备</text>
</g>
</g>

<!-- 4. 消防监测 -->
<g transform="translate(20 810)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M0 10 Q0 0 10 0 L140 0 L160 30 L440 30 L440 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="20" y="22" font-size="18" fill="#00FFA3" font-weight="bold">● 消防监测</text>

<g transform="translate(100 130)">
<circle cx="0" cy="0" r="50" fill="none" stroke="#02181A" stroke-width="12"/>
<circle cx="0" cy="0" r="50" fill="none" stroke="#FFB300" stroke-width="12" stroke-dasharray="314 314"/>
<text x="0" y="10" text-anchor="middle" font-size="36" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(260 100)">
<text x="0" y="0" font-size="32" fill="#00FFA3" font-weight="bold">0</text>
<text x="0" y="30" font-size="14" fill="#B2F0E8">报警设备</text>
</g>
<g transform="translate(360 100)">
<text x="0" y="0" font-size="32" fill="#FF4B4B" font-weight="bold">0</text>
<text x="0" y="30" font-size="14" fill="#B2F0E8">故障设备</text>
</g>
</g>

<!-- ================= 中间主视觉 (数字孪生占位) ================= -->
<g transform="translate(480 90)">
<rect width="960" height="850" fill="#000" fill-opacity="0.4" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
<text x="480" y="425" text-anchor="middle" font-size="48" fill="#00F0FF" font-family="Arial" opacity="0.8" filter="url(#glowTeal)" class="blink">AUTO CONNECTING NOW</text>
<!-- 雷达扫描动效 -->
<g transform="translate(480 415)">
<circle cx="0" cy="0" r="300" fill="none" stroke="#00FFA3" stroke-width="1" stroke-opacity="0.2"/>
<circle cx="0" cy="0" r="200" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
<circle cx="0" cy="0" r="100" fill="none" stroke="#00FFA3" stroke-width="1" stroke-opacity="0.4"/>
<path d="M0 0 L0 -300 A300 300 0 0 1 150 -260 Z" fill="url(#borderGlow)" fill-opacity="0.15" class="rotate-slow" style="transform-origin: 0 0;"/>
</g>
</g>

<!-- 底部导航菜单 -->
<g transform="translate(640 980)">
<rect width="640" height="50" rx="25" fill="#042C2F" stroke="#00F0FF" stroke-opacity="0.6"/>
<text x="120" y="32" text-anchor="middle" font-size="20" fill="#00FFA3" font-weight="bold" filter="url(#glowTeal)">▶ 园区运营</text>
<text x="280" y="32" text-anchor="middle" font-size="20" fill="#B2F0E8">▶ 仓储作业</text>
<text x="400" y="32" text-anchor="middle" font-size="20" fill="#B2F0E8">▶ 设备管理</text>
<text x="540" y="32" text-anchor="middle" font-size="20" fill="#B2F0E8">▶ 检测作业</text>
</g>


<!-- ================= 右侧面板模块 ================= -->
<!-- 5. 告警管理 -->
<g transform="translate(1460 90)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M440 10 Q440 0 430 0 L300 0 L280 30 L0 30 L0 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="420" y="22" text-anchor="end" font-size="18" fill="#00FFA3" font-weight="bold">告警管理 ●</text>

<g transform="translate(100 130)">
<circle cx="0" cy="0" r="50" fill="none" stroke="#02181A" stroke-width="12"/>
<circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="12" stroke-dasharray="100 314"/>
<text x="0" y="10" text-anchor="middle" font-size="36" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(240 70)">
<rect y="0" width="12" height="12" fill="#FF4B4B"/>
<text x="30" y="12" font-size="16" fill="#B2F0E8">紧急告警</text>
<text x="140" y="14" font-size="24" fill="#FFF" font-weight="bold">0<tspan font-size="14">个</tspan></text>

<rect y="40" width="12" height="12" fill="#FFB300"/>
<text x="30" y="52" font-size="16" fill="#B2F0E8">重要告警</text>
<text x="140" y="54" font-size="24" fill="#FFF" font-weight="bold">0<tspan font-size="14">个</tspan></text>

<rect y="80" width="12" height="12" fill="#00F0FF"/>
<text x="30" y="92" font-size="16" fill="#B2F0E8">一般告警</text>
<text x="140" y="94" font-size="24" fill="#FFF" font-weight="bold">0<tspan font-size="14">个</tspan></text>
</g>
</g>

<!-- 6. 人员监测 -->
<g transform="translate(1460 330)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M440 10 Q440 0 430 0 L300 0 L280 30 L0 30 L0 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="420" y="22" text-anchor="end" font-size="18" fill="#00FFA3" font-weight="bold">人员监测 ●</text>

<text x="220" y="80" text-anchor="middle" font-size="18" fill="#B2F0E8">当前在园人数</text>
<text x="220" y="120" text-anchor="middle" font-size="42" fill="#00FFA3" font-weight="bold" class="pulse-text">0<tspan font-size="20">人</tspan></text>

<g transform="translate(30 140)">
<rect width="110" height="50" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="55" y="20" text-anchor="middle" font-size="12" fill="#B2F0E8">今日累计入园</text>
<text x="55" y="42" text-anchor="middle" font-size="20" fill="#FFF" font-weight="bold">0</text>
</g>
<g transform="translate(160 140)">
<rect width="110" height="50" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="55" y="20" text-anchor="middle" font-size="12" fill="#B2F0E8">当前入园访客</text>
<text x="55" y="42" text-anchor="middle" font-size="20" fill="#FFF" font-weight="bold">0</text>
</g>
<g transform="translate(290 140)">
<rect width="110" height="50" fill="#02181A" stroke="#00F0FF" stroke-opacity="0.3"/>
<text x="55" y="20" text-anchor="middle" font-size="12" fill="#B2F0E8">当前外协人数</text>
<text x="55" y="42" text-anchor="middle" font-size="20" fill="#FFF" font-weight="bold">0</text>
</g>
</g>

<!-- 7. 装卸作业 -->
<g transform="translate(1460 570)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M440 10 Q440 0 430 0 L300 0 L280 30 L0 30 L0 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="420" y="22" text-anchor="end" font-size="18" fill="#00FFA3" font-weight="bold">装卸作业 ●</text>

<g transform="translate(100 130)">
<circle cx="0" cy="0" r="50" fill="none" stroke="#02181A" stroke-width="12"/>
<circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="12" stroke-dasharray="50 314"/>
<text x="0" y="10" text-anchor="middle" font-size="36" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(240 70)">
<rect y="0" width="12" height="12" fill="#00FFA3"/>
<text x="30" y="12" font-size="16" fill="#B2F0E8">已完成</text>
<text x="140" y="14" font-size="24" fill="#FFF" font-weight="bold">0<tspan font-size="14">个</tspan></text>

<rect y="40" width="12" height="12" fill="#FFB300"/>
<text x="30" y="52" font-size="16" fill="#B2F0E8">作业中</text>
<text x="140" y="54" font-size="24" fill="#FFF" font-weight="bold">0<tspan font-size="14">个</tspan></text>

<rect y="80" width="12" height="12" fill="#00F0FF"/>
<text x="30" y="92" font-size="16" fill="#B2F0E8">等待作业</text>
<text x="140" y="94" font-size="24" fill="#FFF" font-weight="bold">11<tspan font-size="14">个</tspan></text>
</g>
</g>

<!-- 8. 堆场作业 -->
<g transform="translate(1460 810)">
<rect width="440" height="220" rx="10" fill="url(#panelTeal)" stroke="url(#borderGlow)" stroke-opacity="0.5"/>
<path d="M440 10 Q440 0 430 0 L300 0 L280 30 L0 30 L0 10" fill="none" stroke="#00FFA3" stroke-width="2"/>
<text x="420" y="22" text-anchor="end" font-size="18" fill="#00FFA3" font-weight="bold">堆场作业 ●</text>

<g transform="translate(100 130)">
<circle cx="0" cy="0" r="50" fill="none" stroke="#02181A" stroke-width="12"/>
<circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="12" stroke-dasharray="0 314"/>
<text x="0" y="10" text-anchor="middle" font-size="36" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(240 90)">
<rect y="0" width="12" height="12" fill="#FFB300"/>
<text x="30" y="12" font-size="16" fill="#B2F0E8">空闲</text>
<text x="140" y="14" font-size="32" fill="#FFB300" font-weight="bold">2843<tspan font-size="14">个</tspan></text>

<rect y="60" width="12" height="12" fill="#00F0FF"/>
<text x="30" y="72" font-size="16" fill="#B2F0E8">占用</text>
<text x="140" y="74" font-size="32" fill="#FFF" font-weight="bold">0<tspan font-size="14">个</tspan></text>
</g>
</g>

</svg>