<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- 背景渐变：简约蓝黑商务风 -->
<linearGradient id="bgMinimal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0B132B"/>
<stop offset="100%" stop-color="#020510"/>
</linearGradient>

<!-- 面板背景：毛玻璃质感 -->
<linearGradient id="panelGlass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1A2A4C" stop-opacity="0.6"/>
<stop offset="100%" stop-color="#0E172E" stop-opacity="0.8"/>
</linearGradient>

<!-- 渐变边框 -->
<linearGradient id="borderMinimal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#3A66A7" stop-opacity="0.8"/>
<stop offset="100%" stop-color="#1F365A" stop-opacity="0.3"/>
</linearGradient>

<!-- 强调色 -->
<linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#4D9FFF"/>
<stop offset="100%" stop-color="#2460FF"/>
</linearGradient>
</defs>

<!-- 背景 -->
<rect width="1920" height="1080" fill="url(#bgMinimal)"/>

<!-- 顶部 Header -->
<g transform="translate(0 0)">
<rect width="1920" height="70" fill="#0A142A" stroke-bottom="#3A66A7"/>
<path d="M0 70 L1920 70" stroke="url(#accentBlue)" stroke-width="2"/>
<text x="960" y="45" text-anchor="middle" font-size="32" fill="#E6F0FF" font-family="Microsoft YaHei, Arial" font-weight="bold" letter-spacing="2">清远仓库数字孪生平台 (简约版)</text>
<text x="1880" y="45" text-anchor="end" font-size="18" fill="#8C9BB3">2026-03-20 14:40:29</text>
</g>

<!-- ================= 左侧面板 ================= -->
<!-- 1. 环境监测 -->
<g transform="translate(30 100)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">环境监测</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(20 60)">
<text x="0" y="20" font-size="14" fill="#8C9BB3">温度</text>
<text x="0" y="60" font-size="36" fill="#FFF">23.1<tspan font-size="16" fill="#8C9BB3">°C</tspan></text>
</g>
<g transform="translate(220 60)">
<text x="0" y="20" font-size="14" fill="#8C9BB3">PM10</text>
<text x="0" y="60" font-size="36" fill="#FFF">77.0<tspan font-size="16" fill="#8C9BB3">PU/m³</tspan></text>
</g>
<g transform="translate(20 140)">
<text x="0" y="20" font-size="14" fill="#8C9BB3">湿度</text>
<text x="0" y="60" font-size="36" fill="#FFF">45.9<tspan font-size="16" fill="#8C9BB3">%</tspan></text>
</g>
<g transform="translate(220 140)">
<text x="0" y="20" font-size="14" fill="#8C9BB3">PM2.5</text>
<text x="0" y="60" font-size="36" fill="#FFF">70.0<tspan font-size="16" fill="#8C9BB3">PU/m³</tspan></text>
</g>
</g>

<!-- 2. 能源监测 -->
<g transform="translate(30 330)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">能源监测</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(40 60)">
<line x1="0" y1="120" x2="360" y2="120" stroke="#1F365A" stroke-width="1"/>
<line x1="0" y1="80" x2="360" y2="80" stroke="#1F365A" stroke-width="1"/>
<line x1="0" y1="40" x2="360" y2="40" stroke="#1F365A" stroke-width="1"/>
<path d="M0 120 L60 30 L120 110 L180 100 L240 120 L300 110 L360 120" fill="none" stroke="#2460FF" stroke-width="2"/>
<path d="M0 120 L60 10 L120 120 L180 110 L240 120 L300 100 L360 120" fill="none" stroke="#4D9FFF" stroke-width="2"/>
</g>
</g>

<!-- 3. 安防监测 -->
<g transform="translate(30 560)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">安防监测</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(50 120)">
<circle cx="0" cy="0" r="45" fill="none" stroke="#1A2A4C" stroke-width="10"/>
<circle cx="0" cy="0" r="45" fill="none" stroke="#4D9FFF" stroke-width="10" stroke-dasharray="260 314"/>
<text x="0" y="10" text-anchor="middle" font-size="32" fill="#FFF" font-weight="bold">174</text>
</g>
<g transform="translate(200 80)">
<text x="0" y="0" font-size="32" fill="#4D9FFF">163</text>
<text x="0" y="30" font-size="14" fill="#8C9BB3">在线设备</text>
</g>
<g transform="translate(320 80)">
<text x="0" y="0" font-size="32" fill="#FF5252">11</text>
<text x="0" y="30" font-size="14" fill="#8C9BB3">离线设备</text>
</g>
</g>

<!-- 4. 消防监测 -->
<g transform="translate(30 790)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">消防监测</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(50 120)">
<circle cx="0" cy="0" r="45" fill="none" stroke="#1A2A4C" stroke-width="10"/>
<circle cx="0" cy="0" r="45" fill="none" stroke="#FFB020" stroke-width="10" stroke-dasharray="314 314"/>
<text x="0" y="10" text-anchor="middle" font-size="32" fill="#FFF" font-weight="bold">0</text>
</g>
<g transform="translate(200 80)">
<text x="0" y="0" font-size="32" fill="#4D9FFF">0</text>
<text x="0" y="30" font-size="14" fill="#8C9BB3">报警设备</text>
</g>
<g transform="translate(320 80)">
<text x="0" y="0" font-size="32" fill="#FF5252">0</text>
<text x="0" y="30" font-size="14" fill="#8C9BB3">故障设备</text>
</g>
</g>


<!-- ================= 中间主视觉 ================= -->
<g transform="translate(500 100)">
<rect width="920" height="840" rx="8" fill="#0E172E" stroke="#1F365A" stroke-width="1"/>
<text x="460" y="420" text-anchor="middle" font-size="40" fill="#4D9FFF" font-weight="bold" opacity="0.6">CENTRAL DASHBOARD VIEW</text>
<circle cx="460" cy="400" r="200" fill="none" stroke="#3A66A7" stroke-width="1" stroke-dasharray="10 10" opacity="0.5"/>
<circle cx="460" cy="400" r="100" fill="none" stroke="#3A66A7" stroke-width="1" opacity="0.5"/>
</g>

<!-- 底部导航 -->
<g transform="translate(500 960)">
<rect width="920" height="60" rx="8" fill="url(#panelGlass)" stroke="#1F365A" stroke-width="1"/>
<rect x="20" y="10" width="200" height="40" rx="4" fill="#2460FF"/>
<text x="120" y="36" text-anchor="middle" font-size="18" fill="#FFF" font-weight="bold">园区运营</text>
<text x="360" y="36" text-anchor="middle" font-size="18" fill="#8C9BB3">仓储作业</text>
<text x="560" y="36" text-anchor="middle" font-size="18" fill="#8C9BB3">设备管理</text>
<text x="760" y="36" text-anchor="middle" font-size="18" fill="#8C9BB3">检测作业</text>
</g>


<!-- ================= 右侧面板 ================= -->
<!-- 5. 告警管理 -->
<g transform="translate(1450 100)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">告警管理</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(50 120)">
<circle cx="0" cy="0" r="45" fill="none" stroke="#1A2A4C" stroke-width="10"/>
<circle cx="0" cy="0" r="45" fill="none" stroke="#4D9FFF" stroke-width="10" stroke-dasharray="100 314"/>
<text x="0" y="10" text-anchor="middle" font-size="32" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(200 70)">
<rect y="0" width="8" height="8" fill="#FF5252" rx="2"/>
<text x="20" y="9" font-size="14" fill="#8C9BB3">紧急告警</text>
<text x="120" y="10" font-size="20" fill="#FFF">0<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>

<rect y="40" width="8" height="8" fill="#FFB020" rx="2"/>
<text x="20" y="49" font-size="14" fill="#8C9BB3">重要告警</text>
<text x="120" y="50" font-size="20" fill="#FFF">0<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>

<rect y="80" width="8" height="8" fill="#4D9FFF" rx="2"/>
<text x="20" y="89" font-size="14" fill="#8C9BB3">一般告警</text>
<text x="120" y="90" font-size="20" fill="#FFF">0<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>
</g>
</g>

<!-- 6. 人员监测 -->
<g transform="translate(1450 330)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">人员监测</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<text x="220" y="80" text-anchor="middle" font-size="16" fill="#8C9BB3">当前在园人数</text>
<text x="220" y="120" text-anchor="middle" font-size="40" fill="#4D9FFF" font-weight="bold">0<tspan font-size="16" fill="#8C9BB3"> 人</tspan></text>

<g transform="translate(20 140)">
<rect width="120" height="50" rx="4" fill="#1A2A4C" stroke="#1F365A"/>
<text x="60" y="20" text-anchor="middle" font-size="12" fill="#8C9BB3">今日累计入园</text>
<text x="60" y="42" text-anchor="middle" font-size="20" fill="#FFF">0</text>
</g>
<g transform="translate(160 140)">
<rect width="120" height="50" rx="4" fill="#1A2A4C" stroke="#1F365A"/>
<text x="60" y="20" text-anchor="middle" font-size="12" fill="#8C9BB3">当前入园访客</text>
<text x="60" y="42" text-anchor="middle" font-size="20" fill="#FFF">0</text>
</g>
<g transform="translate(300 140)">
<rect width="120" height="50" rx="4" fill="#1A2A4C" stroke="#1F365A"/>
<text x="60" y="20" text-anchor="middle" font-size="12" fill="#8C9BB3">当前外协人数</text>
<text x="60" y="42" text-anchor="middle" font-size="20" fill="#FFF">0</text>
</g>
</g>

<!-- 7. 装卸作业 -->
<g transform="translate(1450 560)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">装卸作业</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(50 120)">
<circle cx="0" cy="0" r="45" fill="none" stroke="#1A2A4C" stroke-width="10"/>
<circle cx="0" cy="0" r="45" fill="none" stroke="#4D9FFF" stroke-width="10" stroke-dasharray="60 314"/>
<text x="0" y="10" text-anchor="middle" font-size="32" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(200 70)">
<rect y="0" width="8" height="8" fill="#00FFA3" rx="2"/>
<text x="20" y="9" font-size="14" fill="#8C9BB3">已完成</text>
<text x="120" y="10" font-size="20" fill="#FFF">0<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>

<rect y="40" width="8" height="8" fill="#FFB020" rx="2"/>
<text x="20" y="49" font-size="14" fill="#8C9BB3">作业中</text>
<text x="120" y="50" font-size="20" fill="#FFF">0<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>

<rect y="80" width="8" height="8" fill="#4D9FFF" rx="2"/>
<text x="20" y="89" font-size="14" fill="#8C9BB3">等待作业</text>
<text x="120" y="90" font-size="20" fill="#FFF">11<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>
</g>
</g>

<!-- 8. 堆场作业 -->
<g transform="translate(1450 790)">
<rect width="440" height="210" rx="6" fill="url(#panelGlass)" stroke="url(#borderMinimal)" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" fill="#4D9FFF" font-weight="bold">堆场作业</text>
<path d="M20 40 L420 40" stroke="#1F365A" stroke-width="1"/>

<g transform="translate(50 120)">
<circle cx="0" cy="0" r="45" fill="none" stroke="#1A2A4C" stroke-width="10"/>
<circle cx="0" cy="0" r="45" fill="none" stroke="#4D9FFF" stroke-width="10" stroke-dasharray="0 314"/>
<text x="0" y="10" text-anchor="middle" font-size="32" fill="#FFF" font-weight="bold">0</text>
</g>

<g transform="translate(200 90)">
<rect y="0" width="8" height="8" fill="#FFB020" rx="2"/>
<text x="20" y="9" font-size="14" fill="#8C9BB3">空闲</text>
<text x="120" y="10" font-size="30" fill="#FFB020" font-weight="bold">2843<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>

<rect y="50" width="8" height="8" fill="#4D9FFF" rx="2"/>
<text x="20" y="59" font-size="14" fill="#8C9BB3">占用</text>
<text x="120" y="60" font-size="30" fill="#FFF" font-weight="bold">0<tspan font-size="12" fill="#8C9BB3"> 个</tspan></text>
</g>
</g>

</svg>